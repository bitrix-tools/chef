name: Publish Package to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual publish)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  release:
    types:
      - published

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run tests
        run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Configure npm for OIDC
        run: |
          echo "//registry.npmjs.org/:_authToken=" > "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Dry-run mode"
            npm publish --provenance --access public --tag latest --dry-run
          else
            npm publish --provenance --access public --tag latest
          fi

  changelog:
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const sorted = releases
              .filter(r => !r.draft)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            let ru = '# История изменений\n\n';
            let en = '# Changelog\n\n';

            for (const r of sorted) {
              const dateRu = new Date(r.published_at).toLocaleDateString('ru-RU');
              const dateEn = new Date(r.published_at).toLocaleDateString('en-US');
              const name = r.name || r.tag_name;
              const body = (r.body || '').trim();

              // Release body format: "RU text\n\n---\n\nEN text"
              const parts = body.split(/\n---\n/);
              const bodyRu = (parts[0] || '').trim();
              const bodyEn = (parts[1] || '').trim();

              ru += `## ${name} <Badge type="tip" text="${dateRu}" />\n\n`;
              ru += (bodyRu || 'Нет описания.') + '\n\n';

              en += `## ${name} <Badge type="tip" text="${dateEn}" />\n\n`;
              en += (bodyEn || bodyRu || 'No description.') + '\n\n';
            }

            fs.writeFileSync('docs/changelog.md', ru);
            fs.mkdirSync('docs/en', { recursive: true });
            fs.writeFileSync('docs/en/changelog.md', en);

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md docs/en/changelog.md
          git diff --cached --quiet && echo "No changes" && exit 0
          VERSION=${{ github.event.release.tag_name || github.ref_name }}
          git commit -m "docs: update changelog for ${VERSION}"
          git push

      - name: Deploy documentation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yml',
              ref: 'main',
            });
