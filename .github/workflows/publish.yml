name: Publish Package to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual publish)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Dry-run mode"
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ''

  changelog:
    needs: publish
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const sorted = releases
              .filter(r => !r.draft)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            let ru = '# История изменений\n\n';
            let en = '# Changelog\n\n';

            for (const r of sorted) {
              const dateRu = new Date(r.published_at).toLocaleDateString('ru-RU');
              const dateEn = new Date(r.published_at).toLocaleDateString('en-US');
              const name = r.name || r.tag_name;
              const body = (r.body || '').trim();

              ru += `## ${name} <Badge type="tip" text="${dateRu}" />\n\n`;
              ru += (body || 'Нет описания.') + '\n\n';

              en += `## ${name} <Badge type="tip" text="${dateEn}" />\n\n`;
              en += (body || 'No description.') + '\n\n';
            }

            fs.writeFileSync('docs/changelog.md', ru);
            fs.mkdirSync('docs/en', { recursive: true });
            fs.writeFileSync('docs/en/changelog.md', en);

      - name: Commit and push changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.md docs/en/changelog.md
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "docs: update changelog for ${{ github.event.release.tag_name }}"
          git push
